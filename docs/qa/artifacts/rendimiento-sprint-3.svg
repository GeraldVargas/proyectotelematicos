<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Rendimiento: monolito versus microservicios</title>
  <desc id="desc">Comparación k6 a 20 usuarios virtuales. Muestra p95 de login, rutas y radio taxis, además del throughput total.</desc>
  <style>
    .bg { fill: #ffffff; } .text { font-family: Arial, sans-serif; fill: #1d2733; }
    .muted { fill: #536471; font-size: 14px; } .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 15px; } .axis { stroke: #cbd5e1; stroke-width: 1; }
    .label { font-size: 13px; } .value { font-size: 12px; font-weight: 700; }
    .mono { fill: #2563eb; } .micro { fill: #f97316; }
  </style>
  <rect class="bg" width="960" height="560" rx="16"/>
  <text class="text title" x="42" y="48">Rendimiento: monolito vs. microservicios</text>
  <text class="text muted subtitle" x="42" y="74">k6 · 20 VUs · 2 min sostenidos · misma semilla OSM · 0,00 % de errores</text>

  <rect x="42" y="104" width="876" height="322" rx="10" fill="#f8fafc"/>
  <text class="text" x="66" y="136" font-size="18" font-weight="700">Latencia p95 (ms) · menor es mejor</text>
  <line class="axis" x1="235" y1="172" x2="864" y2="172"/><line class="axis" x1="235" y1="242" x2="864" y2="242"/>
  <line class="axis" x1="235" y1="312" x2="864" y2="312"/><line class="axis" x1="235" y1="382" x2="864" y2="382"/>
  <text class="text muted label" x="208" y="176">1 400</text><text class="text muted label" x="208" y="246">1 000</text>
  <text class="text muted label" x="216" y="316">600</text><text class="text muted label" x="222" y="386">0</text>

  <text class="text label" x="70" y="214">Login</text>
  <rect class="mono" x="235" y="186" width="590" height="20" rx="3"/><text class="text value" x="835" y="201">1 319</text>
  <rect class="micro" x="235" y="212" width="334" height="20" rx="3"/><text class="text value" x="579" y="227">746</text>
  <text class="text label" x="70" y="284">Rutas</text>
  <rect class="mono" x="235" y="256" width="308" height="20" rx="3"/><text class="text value" x="553" y="271">688</text>
  <rect class="micro" x="235" y="282" width="563" height="20" rx="3"/><text class="text value" x="808" y="297">1 259</text>
  <text class="text label" x="70" y="354">Radio taxis</text>
  <rect class="mono" x="235" y="326" width="270" height="20" rx="3"/><text class="text value" x="515" y="341">602</text>
  <rect class="micro" x="235" y="352" width="545" height="20" rx="3"/><text class="text value" x="790" y="367">1 216</text>
  <rect class="mono" x="690" y="397" width="14" height="14" rx="2"/><text class="text muted label" x="712" y="409">Monolito</text>
  <rect class="micro" x="795" y="397" width="14" height="14" rx="2"/><text class="text muted label" x="817" y="409">Microservicios</text>

  <rect x="42" y="450" width="876" height="76" rx="10" fill="#f8fafc"/>
  <text class="text" x="66" y="481" font-size="18" font-weight="700">Throughput total (req/s) · mayor es mejor</text>
  <rect class="mono" x="420" y="462" width="315" height="22" rx="3"/><text class="text value" x="745" y="478">39,4</text>
  <rect class="micro" x="420" y="492" width="175" height="22" rx="3"/><text class="text value" x="605" y="508">21,9</text>
</svg>
