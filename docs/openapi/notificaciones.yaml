openapi: 3.0.3
info:
  title: ColcaTrufis — API de Notificaciones
  version: 1.1.0
  description: |
    Notificaciones del usuario autenticado. El usuario se identifica con el claim `sub` del JWT,
    que el Gateway reenvía en el header `X-User-Id`.

    Las notificaciones se generan al consumir eventos (`ruta.actualizada`) de la cola Redis
    `colcatrufis:eventos`. Formato del evento: `docs/eventos/ruta.actualizada.json`.
    Cada notificación se envía por FCM a los dispositivos registrados del usuario.
servers:
  - url: http://localhost:8080
    description: API Gateway local
security:
  - bearerAuth: []
paths:
  /api/notificaciones:
    get:
      operationId: listarNotificaciones
      summary: Notificaciones del usuario, de la más reciente a la más antigua
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: por_pagina, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Página de notificaciones (formato de paginación de Laravel)
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
                  last_page: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notificacion' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
  /api/notificaciones/suscripciones:
    get:
      operationId: listarSuscripciones
      summary: Líneas a las que está suscrito el usuario
      responses:
        '200':
          description: Suscripciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Suscripcion' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
    post:
      operationId: crearSuscripcion
      summary: Suscribirse a los avisos de una línea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [linea]
              properties:
                linea: { type: string, example: '252' }
      responses:
        '201':
          description: Suscripción creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suscripcion' }
        '200':
          description: Ya estaba suscrito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suscripcion' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '422': { description: Datos inválidos }
  /api/notificaciones/suscripciones/{lineaId}:
    delete:
      operationId: eliminarSuscripcion
      summary: Dejar de recibir avisos de una línea
      parameters:
        - { name: lineaId, in: path, required: true, description: Número de línea, schema: { type: string }, example: '252' }
      responses:
        '204': { description: Suscripción eliminada }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { description: El usuario no está suscrito a esa línea }
  /api/notificaciones/historial:
    get:
      operationId: historialNotificaciones
      summary: Historial del usuario con paginación y filtro por fecha
      parameters:
        - { name: desde, in: query, description: 'Fecha o fecha y hora (UTC), inclusive', schema: { type: string }, example: '2026-10-01' }
        - { name: hasta, in: query, description: 'Fecha (incluye el día completo) o fecha y hora (UTC)', schema: { type: string }, example: '2026-10-31' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: por_pagina, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Página de notificaciones (formato de paginación de Laravel)
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
                  last_page: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notificacion' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '422': { description: Fechas o paginación inválidas }
  /api/notificaciones/dispositivos:
    post:
      operationId: registrarDispositivo
      summary: Registrar el token FCM de este dispositivo
      description: Si el token estaba asociado a otra cuenta pasa a la cuenta actual, sin heredar sus envíos pendientes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 20, maxLength: 512 }
                plataforma: { type: string, enum: [android, ios, web], default: android }
      responses:
        '201':
          description: Dispositivo registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispositivo' }
        '200':
          description: El dispositivo ya estaba registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispositivo' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '422': { description: Datos inválidos }
    delete:
      operationId: eliminarDispositivo
      summary: Dejar de recibir push en este dispositivo (al cerrar sesión)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: Dispositivo eliminado }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { description: Token no registrado para este usuario }
        '422': { description: Datos inválidos }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (RS256)
  responses:
    NoAutorizado:
      description: Token ausente, inválido o expirado
  schemas:
    Dispositivo:
      type: object
      properties:
        id: { type: integer }
        plataforma: { type: string, enum: [android, ios, web] }
        created_at: { type: string, format: date-time }
    Suscripcion:
      type: object
      properties:
        id: { type: integer }
        linea: { type: string }
        created_at: { type: string, format: date-time }
    Notificacion:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        tipo: { type: string, example: ruta.actualizada }
        titulo: { type: string, example: Cambio en la línea 252 }
        mensaje: { type: string }
        datos:
          type: object
          nullable: true
          description: Copia de `datos` del evento que originó la notificación
        evento_id: { type: string, format: uuid, nullable: true }
        leida_en: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
