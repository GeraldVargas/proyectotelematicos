name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  servicios:
    name: Tests y lint · ${{ matrix.servicio }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        servicio: [api-usuarios, api-ubicacion, api-notificaciones]
    defaults:
      run:
        working-directory: services/${{ matrix.servicio }}
    services:
      # Solo lo usa api-ubicacion; levantarlo en las tres no estorba
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ubicacion_test
          POSTGRES_USER: ubicacion
          POSTGRES_PASSWORD: ubicacion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ubicacion" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: ubicacion
      DB_PASSWORD: ubicacion
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pdo_mysql, pdo_sqlite
          coverage: pcov
      - name: Cache de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.servicio }}-${{ hashFiles(format('services/{0}/composer.lock', matrix.servicio)) }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Lint (Laravel Pint)
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test --coverage-clover coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-${{ matrix.servicio }}
          path: services/${{ matrix.servicio }}/coverage.xml

  contratos:
    name: Contratos OpenAPI, Gateway y Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validar OpenAPI
        run: |
          for f in docs/openapi/*.yaml; do
            docker run --rm -v "$PWD/docs/openapi:/specs:ro" redocly/cli:1.25.11 lint --extends=minimal "/specs/$(basename "$f")"
          done
      - name: Validar configuración del Gateway
        run: |
          mkdir -p /tmp/keys && echo '{"keys":[]}' > /tmp/keys/jwk.json
          docker run --rm -e FC_ENABLE=1 -e FC_SETTINGS=/etc/krakend/settings \
            -v "$PWD/gateway:/etc/krakend:ro" -v /tmp/keys:/keys:ro \
            devopsfaith/krakend:2.7.2 check -c /etc/krakend/krakend.tmpl -t
      - name: Validar docker-compose.yml
        run: docker compose config -q
      - name: Validar GeoJSON semilla
        run: python3 -c "import json; d=json.load(open('services/api-ubicacion/database/data/rutas_colcapirhua.geojson')); assert d['type']=='FeatureCollection' and len(d['features'])>=3"

  admin-web:
    name: Panel web (sintaxis)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check admin-web/app.js && node --check admin-web/config.js

  flutter:
    name: Flutter (red, mocks y compilacion web)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fronted
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --no-wasm-dry-run --dart-define=GATEWAY_URL=http://localhost:8080

  integracion:
    name: Docker, JWT, CORS, eventos y carga de humo
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: colcatrufis-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construir desde checkout sin dependencias
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke completo (sprints 1 y 2)
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Sprint2
      - name: Smoke original de Linux
        run: bash scripts/smoke-test.sh
      - name: Panel en Chrome real
        run: node scripts/browser-qa.mjs
      - name: k6 funcional (alcance parcial, no linea base del monolito)
        shell: pwsh
        run: ./perf/run.ps1 -Target microservicios -Network colcatrufis-ci_default -BaseUrl http://gateway:8080 -Vus 5 -Duracion 10s -Rampa 5s -Bajada 5s -SinRadiotaxis
      - name: Guardar registros
        if: always()
        run: docker compose logs --no-color > docker-compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integracion-y-rendimiento
          path: |
            docker-compose.log
            docs/qa/artifacts/
            perf/resultados/
      - name: Apagar entorno desechable de CI
        if: always()
        run: docker compose down -v
