openapi: 3.0.3
info:
  title: ColcaTrufis — API de Usuarios
  version: 1.1.0
  description: |
    Registro, login y emisión de JWT RS256 (claims `sub`, `rol`, `exp`).
    Todas las rutas se consumen a través del API Gateway.
servers:
  - url: http://localhost:8080
    description: API Gateway local
tags:
  - name: Autenticación
    description: Registro, acceso JWT, renovación y perfil de usuario
paths:
  /api/usuarios/registro:
    post:
      operationId: registrarUsuario
      tags: [Autenticación]
      summary: Registrar un usuario de la app (rol `usuario`)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, example: María Quispe }
                email: { type: string, format: email, example: maria@correo.bo }
                password: { type: string, minLength: 8, example: clave12345 }
                password_confirmation: { type: string, example: clave12345 }
            example:
              name: María Quispe
              email: maria@correo.bo
              password: clave12345
              password_confirmation: clave12345
      responses:
        '201':
          description: Usuario creado y sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
              example:
                token_type: Bearer
                access_token: eyJhbGciOiJSUzI1NiIsImtpZCI6ImNvbGNhdHJ1ZmlzLTEifQ.ejemplo
                expires_in: 3600
                refresh_token: refresh_token_de_ejemplo
                usuario: { id: 3, name: María Quispe, email: maria@correo.bo, rol: usuario, activo: true }
        '422': { $ref: '#/components/responses/Validacion' }
  /api/usuarios/login:
    post:
      operationId: iniciarSesion
      tags: [Autenticación]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: demo@colcatrufis.local }
                password: { type: string, example: demo12345 }
            example:
              email: demo@colcatrufis.local
              password: demo12345
      responses:
        '200':
          description: Credenciales correctas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
              example:
                token_type: Bearer
                access_token: eyJhbGciOiJSUzI1NiIsImtpZCI6ImNvbGNhdHJ1ZmlzLTEifQ.ejemplo
                expires_in: 3600
                refresh_token: refresh_token_de_ejemplo
                usuario: { id: 2, name: Usuario Demo, email: demo@colcatrufis.local, rol: usuario, activo: true }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: Usuario desactivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validacion' }
  /api/usuarios/refresh:
    post:
      operationId: renovarSesion
      tags: [Autenticación]
      summary: Renovar el access token
      description: El refresh token se rota; el anterior deja de ser válido.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
            example:
              refresh_token: refresh_token_de_ejemplo
      responses:
        '200':
          description: Nuevo par de tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
              example:
                token_type: Bearer
                access_token: eyJhbGciOiJSUzI1NiIsImtpZCI6ImNvbGNhdHJ1ZmlzLTEifQ.token_renovado
                expires_in: 3600
                refresh_token: refresh_token_rotado_de_ejemplo
                usuario: { id: 2, name: Usuario Demo, email: demo@colcatrufis.local, rol: usuario, activo: true }
        '401': { $ref: '#/components/responses/NoAutorizado' }
  /api/usuarios/perfil:
    get:
      operationId: obtenerPerfil
      tags: [Autenticación]
      summary: Perfil del usuario autenticado
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
              example: { id: 2, name: Usuario Demo, email: demo@colcatrufis.local, rol: usuario, activo: true }
        '401': { $ref: '#/components/responses/NoAutorizado' }
  /api/usuarios/perfil/{id}:
    get:
      operationId: obtenerPerfilPorId
      tags: [Autenticación]
      summary: Perfil por ID
      description: Cada usuario puede consultar el suyo; `admin` y `encargado`, el de cualquiera.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
              example: { id: 1, name: Administrador, email: admin@colcatrufis.local, rol: admin, activo: true }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: Perfil ajeno sin el rol necesario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/usuarios/lista:
    get:
      operationId: listarUsuarios
      tags: [Autenticación]
      summary: Lista paginada de usuarios (solo `admin`)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: por_pagina, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Página de usuarios (formato de paginación de Laravel)
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_page: { type: integer, example: 1 }
                  per_page: { type: integer, example: 20 }
                  total: { type: integer, example: 2 }
                  last_page: { type: integer, example: 1 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Usuario' }
              example:
                current_page: 1
                per_page: 20
                total: 2
                last_page: 1
                data:
                  - { id: 1, name: Administrador, email: admin@colcatrufis.local, rol: admin, activo: true }
                  - { id: 2, name: Usuario Demo, email: demo@colcatrufis.local, rol: usuario, activo: true }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: El usuario autenticado no tiene rol admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validacion' }
  /api/usuarios/sesion:
    delete:
      operationId: cerrarSesion
      tags: [Autenticación]
      summary: Cerrar sesión
      description: |
        Revoca en la BD el `refresh_token` indicado. Sin cuerpo cierra todas las sesiones del usuario.
        El access token es un JWT sin estado: sigue siendo válido hasta su `exp` (1 hora como máximo),
        por lo que el cliente debe borrarlo.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
            example:
              refresh_token: refresh_token_de_ejemplo
      responses:
        '204': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '422': { $ref: '#/components/responses/Validacion' }
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (RS256)
  responses:
    NoAutorizado:
      description: Token ausente, inválido o expirado / credenciales incorrectas
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validacion:
      description: Datos inválidos
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
    Usuario:
      type: object
      properties:
        id: { type: integer, example: 2 }
        name: { type: string, example: Usuario Demo }
        email: { type: string, example: demo@colcatrufis.local }
        rol: { type: string, enum: [admin, encargado, usuario] }
        activo: { type: boolean }
    Tokens:
      type: object
      properties:
        token_type: { type: string, example: Bearer }
        access_token:
          type: string
          description: 'JWT RS256. Header `kid: colcatrufis-1`. Claims: iss, sub, rol, iat, exp'
        expires_in: { type: integer, example: 3600, description: Segundos de vida del access token }
        refresh_token: { type: string, description: 'Opaco, 64 caracteres, válido 30 días' }
        usuario: { $ref: '#/components/schemas/Usuario' }
