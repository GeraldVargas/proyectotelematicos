openapi: 3.0.3
info:
  title: ColcaTrufis — API de Ubicación
  version: 1.2.0
  description: |
    Rutas y paradas almacenadas en PostGIS (EPSG:4326) y servidas como GeoJSON (RFC 7946).
    Las coordenadas siempre van en orden **[longitud, latitud]**.

    Datos iniciales: © colaboradores de OpenStreetMap (ODbL).
servers:
  - url: http://localhost:8080
    description: API Gateway local
security:
  - bearerAuth: []
tags:
  - name: Rutas
    description: Recorridos de transporte y edición administrativa
  - name: Paradas
    description: Paradas y búsqueda espacial por distancia
  - name: Radio taxis
    description: Posición actual de los radio taxis disponibles
paths:
  /api/ubicacion/rutas:
    get:
      operationId: listarRutas
      tags: [Rutas]
      summary: Todas las rutas como FeatureCollection
      parameters:
        - { name: linea, in: query, schema: { type: string }, example: '252' }
        - { name: sindicato, in: query, schema: { type: string }, description: 'Coincidencia parcial, sin distinguir mayúsculas' }
        - { name: estado, in: query, schema: { type: string, enum: [activa, suspendida] } }
      responses:
        '200':
          description: Rutas
          content:
            application/geo+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FeatureCollection'
                  - type: object
                    properties:
                      features:
                        type: array
                        items: { $ref: '#/components/schemas/RutaFeature' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
  /api/ubicacion/rutas/{id}:
    put:
      operationId: actualizarRuta
      tags: [Rutas]
      summary: Editar un trazado (solo administrador)
      description: |
        El Gateway valida el JWT y propaga la identidad. Solo el rol admin puede editar.
        Se guardan la ruta y su evento ruta.actualizada en una misma transacción.
        El worker de salida reintenta publicarlo en Redis si el broker no está disponible.
        Las paradas y el número de línea se conservan. Coordenadas en orden [lng, lat].
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdicionRuta' }
      responses:
        '200':
          description: Trazado guardado; el evento queda pendiente de entrega asíncrona
          content:
            application/geo+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RutaFeature'
                  - type: object
                    properties:
                      meta:
                        type: object
                        properties:
                          evento_id: { type: string, format: uuid }
                          notificacion: { type: string, enum: [pendiente] }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: El usuario autenticado no tiene rol admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Ruta no encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validacion' }
    get:
      operationId: obtenerRuta
      tags: [Rutas]
      summary: Geometría, atributos y paradas de una ruta
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Ruta
          content:
            application/geo+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RutaFeature'
                  - type: object
                    properties:
                      properties:
                        type: object
                        properties:
                          paradas:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer }
                                nombre: { type: string }
                                orden: { type: integer }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404':
          description: Ruta no encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/ubicacion/paradas:
    get:
      operationId: listarParadas
      tags: [Paradas]
      summary: Paradas como puntos GeoJSON
      parameters:
        - { name: ruta_id, in: query, schema: { type: integer }, description: Solo las paradas de esta ruta }
      responses:
        '200':
          description: Paradas
          content:
            application/geo+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FeatureCollection'
                  - type: object
                    properties:
                      features:
                        type: array
                        items: { $ref: '#/components/schemas/ParadaFeature' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
  /api/ubicacion/paradas/cercanas:
    get:
      operationId: buscarParadasCercanas
      tags: [Paradas]
      summary: Paradas cercanas ordenadas por distancia en metros
      description: Búsqueda ST_DWithin sobre geography con índice GiST; EPSG 4326.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 }, example: -17.3895 }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 }, example: -66.2405 }
        - { name: radio, in: query, schema: { type: number, minimum: 1, maximum: 5000, default: 300 }, description: Radio en metros }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: FeatureCollection, posiblemente vacía, ordenada por distancia e ID
          content:
            application/geo+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FeatureCollection'
                  - type: object
                    properties:
                      features:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/ParadaFeature'
                            - type: object
                              properties:
                                properties:
                                  type: object
                                  properties:
                                    distancia_m: { type: number, minimum: 0, example: 112.35 }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '422': { $ref: '#/components/responses/Validacion' }
  /api/ubicacion/radiotaxis:
    get:
      operationId: listarRadiotaxis
      tags: [Radio taxis]
      summary: Posición actual de los radio taxis disponibles
      description: |
        Los clientes consultan este recurso periódicamente (cada 30 s). `origen` indica de dónde sale
        el punto: `demo` son datos ficticios de desarrollo y `monolito` es la parada base del sindicato;
        todavía no hay GPS de vehículos.
      responses:
        '200':
          description: Radio taxis disponibles con posición conocida
          content:
            application/geo+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FeatureCollection'
                  - type: object
                    properties:
                      features:
                        type: array
                        items: { $ref: '#/components/schemas/RadiotaxiFeature' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
  /api/ubicacion/radiotaxis/{id}/posicion:
    put:
      operationId: actualizarPosicionRadiotaxi
      tags: [Radio taxis]
      summary: Actualizar la posición y disponibilidad (solo administrador)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, minimum: -90, maximum: 90, example: -17.3895 }
                lng: { type: number, minimum: -180, maximum: 180, example: -66.2405 }
                disponible: { type: boolean }
      responses:
        '200':
          description: Posición guardada
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/RadiotaxiFeature' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: El usuario autenticado no tiene rol admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Radio taxi no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validacion' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (RS256)
  responses:
    Validacion:
      description: Coordenadas, radio, trazado o atributos inválidos
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
    NoAutorizado:
      description: Token ausente, inválido o expirado (lo responde el Gateway)
  schemas:
    EdicionRuta:
      type: object
      required: [geometry, descripcion]
      properties:
        geometry:
          type: object
          required: [type, coordinates]
          additionalProperties: false
          properties:
            type: { type: string, enum: [LineString] }
            coordinates:
              type: array
              minItems: 2
              maxItems: 10000
              description: Al menos dos posiciones diferentes, longitud [-180,180] y latitud [-90,90]
              items: { $ref: '#/components/schemas/Posicion' }
              example: [[-66.2405, -17.3895], [-66.2380, -17.3901]]
        descripcion: { type: string, minLength: 5, maxLength: 500, example: Desvío temporal por obras en la vía }
        nombre: { type: string, minLength: 1, maxLength: 255 }
        sindicato: { type: string, nullable: true, maxLength: 255 }
        estado: { type: string, enum: [activa, suspendida] }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        horario: { type: string, nullable: true, maxLength: 255 }
        tarifa: { type: number, nullable: true, minimum: 0, maximum: 9999.99 }
        frecuencia_min: { type: integer, nullable: true, minimum: 1, maximum: 1440 }
    Error:
      type: object
      properties:
        message: { type: string }
    Posicion:
      type: array
      description: '[longitud, latitud]'
      minItems: 2
      maxItems: 2
      items: { type: number }
      example: [-66.2405, -17.3895]
    FeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: { type: string, enum: [FeatureCollection] }
        features: { type: array, items: { type: object } }
    RutaFeature:
      type: object
      properties:
        type: { type: string, enum: [Feature] }
        id: { type: integer }
        geometry:
          type: object
          properties:
            type: { type: string, enum: [LineString] }
            coordinates:
              type: array
              items: { $ref: '#/components/schemas/Posicion' }
        properties:
          type: object
          properties:
            id: { type: integer }
            linea: { type: string, example: '252' }
            nombre: { type: string, example: 'Trufi 252: Calle Litoral → Avenida Blanco Galindo' }
            sindicato: { type: string, nullable: true, example: Asociación de taxi trufis 1ro de mayo }
            tipo: { type: string, nullable: true, example: Trufi }
            desde: { type: string, nullable: true }
            hasta: { type: string, nullable: true }
            tarifa: { type: number, nullable: true, description: Bolivianos }
            frecuencia_min: { type: integer, nullable: true }
            horario: { type: string, nullable: true, example: '06:00-21:00' }
            color: { type: string, example: '#E53935' }
            estado: { type: string, enum: [activa, suspendida] }
    ParadaFeature:
      type: object
      properties:
        type: { type: string, enum: [Feature] }
        id: { type: integer }
        geometry:
          type: object
          properties:
            type: { type: string, enum: [Point] }
            coordinates: { $ref: '#/components/schemas/Posicion' }
        properties:
          type: object
          properties:
            id: { type: integer }
            nombre: { type: string }
            descripcion: { type: string, nullable: true }
            rutas:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  linea: { type: string }
                  color: { type: string }
    RadiotaxiFeature:
      type: object
      properties:
        type: { type: string, enum: [Feature] }
        id: { type: integer }
        geometry:
          type: object
          properties:
            type: { type: string, enum: [Point] }
            coordinates: { $ref: '#/components/schemas/Posicion' }
        properties:
          type: object
          properties:
            id: { type: integer }
            nombre: { type: string, example: Radio Taxi Demo 1 }
            sindicato: { type: string, nullable: true }
            telefono: { type: string, nullable: true }
            disponible: { type: boolean }
            origen: { type: string, enum: [demo, monolito] }
            posicion_actualizada_en: { type: string, format: date-time, nullable: true }
